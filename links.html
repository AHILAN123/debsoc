<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DebSoc — Links</title>
<link rel="stylesheet" href="assets/css/pages/links.css">
</head>
<body>

<div class="top-layout">
  <article class="hero-frame">
    <div class="tr-bar"><span>Tribunal</span><i></i></div>
    <div class="hero-body">
      <div class="zine-embed">
        <iframe allow="autoplay; fullscreen; clipboard-write" scrolling="no"
          src="https://heyzine.com/flip-book/2e319b8dcc.html"
          title="Tribunal Zine"></iframe>
      </div>
    </div>
  </article>

  <div class="gal-red" aria-label="DebSoc photo gallery"><div class="gal-grid"><figure class="gal-thumb"><img src="assets/images/events/debsoc-meet-march.webp" alt="DebSoc meeting" loading="lazy"></figure><figure class="gal-thumb"><img src="assets/images/history/2026-4.webp" alt="DISEC event" loading="lazy"></figure><figure class="gal-thumb"><img src="assets/images/history/2018-2.webp" alt="Lok Sabha event" loading="lazy"></figure><figure class="gal-thumb"><img src="assets/images/events/vicharagini.webp" alt="Vicharagini event" loading="lazy"></figure><figure class="gal-thumb"><img src="assets/images/history/2026-3.webp" alt="BECON event" loading="lazy"></figure><figure class="gal-thumb"><img src="assets/images/history/2026-2.webp" alt="DebSoc members" loading="lazy"></figure><figure class="gal-thumb"><img src="assets/images/events/becon/highlights-04.webp" alt="BECON committee" loading="lazy"></figure><figure class="gal-thumb"><img src="assets/images/events/memorial-debate.webp" alt="Memorial debate" loading="lazy"></figure></div></div>
</div>

<main class="stack">


  <a class="frame" href="https://www.instagram.com/debsoc_iiests/" target="_blank" rel="noopener">
    <h2>Instagram</h2>
    <span class="arrow">Open</span>
  </a>

  <a class="frame" href="https://www.debsociiests.in/timeline" target="_blank" rel="noopener">
    <h2>History</h2>
    <span class="arrow">Open</span>
  </a>

</main>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxClose = document.getElementById('lightbox-close');

  function openLightbox(src, alt){
    lightboxImg.src = src;
    lightboxImg.alt = alt || '';
    lightbox.classList.add('is-open');
  }
  function closeLightbox(){
    lightbox.classList.remove('is-open');
    lightboxImg.src = '';
  }

  document.querySelectorAll('.gal-thumb').forEach((fig) => {
    const img = fig.querySelector('img');
    fig.tabIndex = 0;
    fig.setAttribute('role', 'button');
    fig.addEventListener('click', () => openLightbox(img.src, img.alt));
    fig.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(img.src, img.alt); }
    });
  });

  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (event) => {
    if (event.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeLightbox();
  });
</script>
<script src="assets/js/footer.js"></script>
<script src="assets/js/nav.js"></script>
</body>
</html>
