<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Access — DebSoc IIEST Shibpur</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/css/pages/register.css">

<link rel="stylesheet" href="assets/css/editorial.css">
</head>

<body
 class="editorial-page min-h-screen bg-[#0B0C10] font-sans-body text-[#FAF7F2] flex flex-col selection:bg-[#DAA520] selection:text-[#800020]">
  

  <!-- Main Container -->
<main class="flex-1 px-4 py-14">
  <div class="auth-wrap">

    <div class="auth-window">

      <div class="auth-titlebar">
        <span>DEBSOC ACCESS</span>

        <div class="auth-titlebar-right">
          <span class="window-button">_</span>
          <span class="window-button">□</span>
          <span class="window-button">×</span>
        </div>
      </div>

      <div class="auth-menubar">
        <span>File</span>
        <span>Account</span>
        <span>Help</span>
      </div>

      <div class="auth-body">

        <div class="auth-heading">
          

          <h1 id="page-title">Create Account</h1>

          <p id="page-subtitle">
            Use your personal or institutional email address.
          </p>
        </div>

        <div id="auth-alert" class="auth-alert hidden"></div>

        <form id="register-form" class="auth-form">

          <div id="field-displayName" class="auth-field">
            <label for="reg-displayName">Full Name</label>
            <input
              type="text"
              id="reg-displayName"
              required
              placeholder="e.g. Anik Chakraborty"
              class="auth-input"
            >
          </div>

          <div id="field-username" class="auth-field">
            <label for="reg-username">DebSoc Handle</label>
            <input
              type="text"
              id="reg-username"
              required
              placeholder="e.g. anik_c"
              class="auth-input"
            >
          </div>

          <div class="auth-field">
            <label for="reg-email">Email Address</label>
            <input
              type="email"
              id="reg-email"
              required
              placeholder="you@example.com"
              class="auth-input"
            >
          </div>

          <div class="auth-field">
            <label for="reg-password">Password</label>
            <input
              type="password"
              id="reg-password"
              required
              placeholder="••••••••••••"
              class="auth-input"
            >
          </div>

          <div id="field-otp" class="auth-field hidden">
            <label for="reg-otp">6-Digit OTP</label>
            <input
              type="text"
              id="reg-otp"
              maxlength="6"
              placeholder="123456"
              class="auth-input otp-input"
            >
          </div>

          <a
            href="#"
            id="forgot-password-link"
            class="auth-link hidden"
          >
            Forgot password?
          </a>

          <button
            type="submit"
            id="submit-btn"
            class="auth-button"
          >
            Complete Registration
          </button>

        </form>

        <form id="forgot-password-form" class="auth-form hidden">

          <div id="forgot-password-alert" class="auth-alert hidden"></div>

          <div id="field-forgot-email" class="auth-field">
            <label for="forgot-email">Email Address</label>
            <input
              type="email"
              id="forgot-email"
              placeholder="you@example.com"
              class="auth-input"
            >
          </div>

          <div id="field-forgot-otp" class="auth-field hidden">
            <label for="forgot-otp">Verification Code</label>
            <input
              type="text"
              id="forgot-otp"
              maxlength="6"
              inputmode="numeric"
              placeholder="123456"
              class="auth-input otp-input"
            >
          </div>

          <div id="field-forgot-newpassword" class="auth-field hidden">
            <label for="forgot-newpassword">New Password</label>
            <input
              type="password"
              id="forgot-newpassword"
              placeholder="••••••••••••"
              class="auth-input"
            >
          </div>

          <button
            type="submit"
            id="forgot-submit-btn"
            class="auth-button"
          >
            Send Reset Code
          </button>

          <button
            type="button"
            id="back-to-login-btn"
            class="auth-switch"
          >
            ← Back to Sign In
          </button>

        </form>

        <div class="auth-bottom">
          <span id="toggle-text">
            Already registered on the circuit?
          </span>

          <button
            id="toggle-mode-btn"
            type="button"
            class="auth-switch"
          >
            Sign In
          </button>
        </div>

      </div>
    </div>

  </div>
</main>


  <script src="assets/js/auth-page.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="assets/js/nav.js"></script>
</body>

</html>
