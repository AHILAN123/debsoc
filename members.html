<!doctype html>
<html lang="en">
<head>
<script src="assets/js/session.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members | DebSoc IIEST Shibpur</title>
  <link rel="icon" href="favicon.ico">
  <script>try { if (localStorage.getItem("debsoc_profile_theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}</script>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/pages/profile.css">
  <style>
    .m-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 3px; background: var(--gd); }
    .m-card { display: flex; align-items: center; gap: 10px; padding: 10px; color: var(--ink); text-decoration: none; background: var(--g); box-shadow: inset 1px 1px 0 #ececec; min-width: 0; }
    .m-card:hover, .m-card:focus-visible { background: #dcdcf2; outline: 1px dotted #000; outline-offset: -4px; }
    .m-avatar { flex: none; width: 44px; height: 44px; display: grid; place-items: center; overflow: hidden; border: 2px inset #fff; background: #fff; font: 700 14px var(--mono); color: var(--blue); }
    .m-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .m-name { display: block; font: 700 14px var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .m-user { display: block; font: 12px var(--mono); color: #444; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .m-empty { padding: 14px; }
    [data-theme="dark"] .m-card:hover, [data-theme="dark"] .m-card:focus-visible { background: rgba(255, 61, 90, .16); }
    [data-theme="dark"] .m-user { color: #bbb; }
  </style>
</head>
<body>
  <div class="profile-shell">
    <div class="win profile-hero">

      <div class="tb">
        <span>DebSoc Explorer, Members</span>
        <span class="tb-actions"><span class="wbtns" aria-hidden="true"><i>_</i><i>&#9633;</i><i>&times;</i></span></span>
      </div>

      <div class="stack">
        <div class="row menu" role="group" aria-label="Members links">
          <div class="cell"><a href="index.html">Home</a></div>
          <div class="cell"><a href="history.html">archive</a></div>
          <div class="cell"><a href="members.html">members</a></div>
        </div>

        <form id="members-search-form" class="url">
          <button type="submit" aria-label="Search members"><span>Search</span></button>
          <div class="cell">
            <label class="field">
              <span>find://</span>
              <input id="members-search-input" placeholder="name or username" aria-label="Search members" autocomplete="off">
            </label>
          </div>
        </form>

        <div id="members-status" class="cell">Loading members...</div>
        <div id="members-grid" class="m-grid hidden"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var API = "/api";
      var input = document.getElementById("members-search-input");
      var form = document.getElementById("members-search-form");
      var status = document.getElementById("members-status");
      var grid = document.getElementById("members-grid");
      var timer = null;
      var seq = 0;

      function esc(v) {
        return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function initials(name) {
        return String(name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(function (p) { return p[0]; }).join("").toUpperCase();
      }
      function safeImg(url) { return typeof url === "string" && /^https?:\/\//i.test(url) ? url : ""; }

      function render(users, q) {
        if (!users.length) {
          grid.classList.add("hidden");
          status.classList.remove("hidden");
          status.textContent = q ? 'No members match "' + q + '".' : "No members yet.";
          return;
        }
        status.classList.add("hidden");
        grid.classList.remove("hidden");
        grid.innerHTML = users.map(function (u) {
          var img = safeImg(u.profileImage);
          return '<a class="m-card" href="profile.html?u=' + encodeURIComponent(u.username) + '">' +
            '<span class="m-avatar">' + (img ? '<img src="' + esc(img) + '" alt="" loading="lazy">' : esc(initials(u.displayName))) + '</span>' +
            '<span style="min-width:0"><span class="m-name">' + esc(u.displayName) + '</span><span class="m-user">@' + esc(u.username) + '</span></span></a>';
        }).join("");
      }

      function load(q) {
        var mine = ++seq;
        status.classList.remove("hidden");
        grid.classList.add("hidden");
        status.textContent = "Loading members...";
        fetch(API + "/users?limit=100" + (q ? "&q=" + encodeURIComponent(q) : ""))
          .then(function (r) { if (!r.ok) throw new Error("Could not load members."); return r.json(); })
          .then(function (d) { if (mine === seq) render(d.users || [], q); })
          .catch(function (e) { if (mine === seq) { status.classList.remove("hidden"); grid.classList.add("hidden"); status.textContent = e.message; } });
      }

      function syncUrl(q) {
        try { history.replaceState(null, "", q ? "?q=" + encodeURIComponent(q) : location.pathname); } catch (e) { /* ignore */ }
      }

      form.addEventListener("submit", function (e) { e.preventDefault(); var q = input.value.trim(); syncUrl(q); load(q); });
      input.addEventListener("input", function () {
        clearTimeout(timer);
        timer = setTimeout(function () { var q = input.value.trim(); syncUrl(q); load(q); }, 300);
      });

      var initial = new URLSearchParams(location.search).get("q") || "";
      input.value = initial;
      load(initial.trim());
    })();
  </script>
  <script src="assets/js/footer.js"></script>
  <script src="assets/js/nav.js"></script>
</body>
</html>
