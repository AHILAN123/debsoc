<script>
  function arrangeTeamPool() {
    const stage = document.querySelector('.team-stage');
    const clock = document.getElementById('centralPrint');
    const pool = document.getElementById('portraitPool');
    if (!stage || !clock || !pool) return;

    const items = Array.from(pool.querySelectorAll('.pool-item'));

    const rank = {2027: 0, 2028: 1, 2029: 2};
    items.sort((a, b) =>
      (rank[a.dataset.batch] - rank[b.dataset.batch]) ||
      (Number(a.dataset.order) - Number(b.dataset.order))
    );

    items.forEach(item => pool.appendChild(item));

    const stageRect = stage.getBoundingClientRect();
    const clockRect = clock.getBoundingClientRect();

    const clockLeft = clockRect.left - stageRect.left;
    const clockRight = clockLeft + clockRect.width;
    const clockTop = clockRect.top - stageRect.top;
    const clockBottom = clockTop + clockRect.height;

    const winWidth = window.innerWidth;
    const mobile = winWidth <= 650;
    const tablet = winWidth <= 980;

    const tileSize = mobile ? 85 : tablet ? 110 : Math.min(130, winWidth * 0.085);
    const sideGapX = mobile ? 10 : 16;
    const sideGapY = mobile ? 20 : 28;
    const sidePad = mobile ? 10 : 24;
    const cardExtraHeight = 45;

    items.forEach(item => {
      item.style.width = tileSize + 'px';
    });

    const leftAvailableWidth = clockLeft - sidePad;
    const rightAvailableWidth = stage.clientWidth - clockRight - sidePad;

    const leftCols = Math.max(0, Math.floor((leftAvailableWidth + sideGapX) / (tileSize + sideGapX)));
    const rightCols = Math.max(0, Math.floor((rightAvailableWidth + sideGapX) / (tileSize + sideGapX)));
    const sideRows = Math.max(1, Math.floor((clockRect.height + sideGapY) / (tileSize + cardExtraHeight + sideGapY)));

    const slots = [];

    for (let r = 0; r < sideRows; r++) {
      const y = clockTop + r * (tileSize + cardExtraHeight + sideGapY);
      if (y + tileSize + cardExtraHeight > clockBottom + 20) break;

      for (let c = 0; c < Math.max(leftCols, rightCols); c++) {
        if (c < leftCols) {
          const xLeft = sidePad + c * (tileSize + sideGapX);
          if (xLeft + tileSize <= clockLeft - 8) {
            slots.push({ x: xLeft, y, size: tileSize });
          }
        }
        if (c < rightCols) {
          const xRight = clockRight + sidePad + c * (tileSize + sideGapX);
          if (xRight + tileSize <= stage.clientWidth - sidePad) {
            slots.push({ x: xRight, y, size: tileSize });
          }
        }
      }
    }

    let placedCount = 0;

    for (const slot of slots) {
      if (placedCount >= items.length) break;
      const item = items[placedCount];
      item.style.width = slot.size + 'px';
      item.style.left = slot.x + 'px';
      item.style.top = slot.y + 'px';
      placedCount++;
    }

    const startBelowY = clockBottom + (mobile ? 40 : 54);
    const maxPoolWidth = Math.min(stage.clientWidth - (sidePad * 2), 1200);
    const poolLeftMargin = (stage.clientWidth - maxPoolWidth) / 2;

    const gridCols = mobile ? 3 : tablet ? 5 : 7;
    const gridGapX = mobile ? 12 : 20;
    const gridGapY = mobile ? 20 : 30;
    const belowTileSize = mobile ? 85 : Math.min(130, (maxPoolWidth - (gridCols - 1) * gridGapX) / gridCols);

    const remainingItems = items.length - placedCount;
    const rowsBelow = Math.ceil(remainingItems / gridCols);

    for (let i = placedCount; i < items.length; i++) {
      const idx = i - placedCount;
      const col = idx % gridCols;
      const row = Math.floor(idx / gridCols);

      const x = poolLeftMargin + col * (belowTileSize + gridGapX);
      const y = startBelowY + row * (belowTileSize + cardExtraHeight + gridGapY);
      const item = items[i];

      item.style.width = belowTileSize + 'px';
      item.style.left = x + 'px';
      item.style.top = y + 'px';
    }

    const totalHeightRequired = remainingItems > 0
      ? startBelowY + rowsBelow * (belowTileSize + cardExtraHeight + gridGapY) + 60
      : clockBottom + 80;

    stage.style.minHeight = Math.max(totalHeightRequired, 700) + 'px';
    pool.style.height = stage.offsetHeight + 'px';
  }

  function initLightboxModal() {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const modalTitle = document.getElementById('modalTitle');
    const modalSubtitle = document.getElementById('modalSubtitle');
    const modalClose = document.getElementById('modalClose');

    function openModal(imgSrc, title, subtitle) {
      modalImg.src = imgSrc;
      modalImg.alt = title || 'Expanded image view';
      modalTitle.textContent = title || '';
      modalSubtitle.textContent = subtitle || '';
      
      modalSubtitle.style.display = subtitle ? 'block' : 'none';
      
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      setTimeout(() => {
        if (!modal.classList.contains('active')) {
          modalImg.src = '';
        }
      }, 300);
    }

    // Central clock tower click
    const centralPrint = document.getElementById('centralPrint');
    if (centralPrint) {
      centralPrint.addEventListener('click', () => {
        const img = centralPrint.querySelector('img');
        const title = centralPrint.dataset.title || 'IIEST Shibpur Clock Tower';
        const subtitle = centralPrint.dataset.subtitle || 'Landmark Architecture';
        if (img) openModal(img.src, title, subtitle);
      });
    }

    // Team member portrait cards click
    const poolItems = document.querySelectorAll('.pool-item');
    poolItems.forEach(item => {
      item.addEventListener('click', () => {
        const img = item.querySelector('.pool-photo img');
        const label = item.querySelector('.pool-label');
        if (!img) return;

        let title = '';
        let subtitle = '';

        if (label) {
          const mainTextNode = Array.from(label.childNodes)
            .filter(node => node.nodeType === Node.TEXT_NODE)
            .map(node => node.textContent.trim())
            .join(' ');
          
          title = mainTextNode || img.alt || '';
          
          const badgeSpan = label.querySelector('span');
          if (badgeSpan) {
            subtitle = badgeSpan.textContent.trim();
          } else if (item.dataset.batch) {
            subtitle = `Batch of ${item.dataset.batch}`;
          }
        } else {
          title = img.alt || 'Team Member';
        }

        openModal(img.src, title, subtitle);
      });
    });

    // Close on button click
    if (modalClose) {
      modalClose.addEventListener('click', closeModal);
    }

    // Close on click outside content
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });

    // Close on Escape key press
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });
  }

  function initTeamLayout() {
    const clockImg = document.getElementById('clockImage');
    if (clockImg && !clockImg.complete) {
      clockImg.addEventListener('load', arrangeTeamPool, { once: true });
    } else {
      arrangeTeamPool();
    }
    initLightboxModal();
  }

  window.addEventListener('load', initTeamLayout);
  window.addEventListener('resize', () => requestAnimationFrame(arrangeTeamPool));
</script>
